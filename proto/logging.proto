syntax = "proto3";

package logging;

service LoggingService {
  rpc LogMessage(LogRequest) returns (LogResponse);
  rpc GetMessages(GetRequest) returns (GetResponse);
}

message LogRequest {
  string message = 1;
}

message LogResponse {
  bool success = 1;
}

message GetRequest {
  // perhaps get all or by id, but for simplicity, get all
}

message GetResponse {
  repeated string messages = 1;
}